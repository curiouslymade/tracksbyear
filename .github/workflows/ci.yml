# Runs on each push and pull request. Branch protection on main needs this check to pass.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build, test and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Use npm 10.9.2, the same as Cloudflare Workers Builds
        run: npm install --global npm@10.9.2

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build, then check headers, source link and previews
        run: npm run build

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz

      - name: Scan the full git history for secrets
        run: gitleaks git --redact --verbose .

      - name: Scan the built site for secrets
        run: gitleaks dir --redact --verbose dist
