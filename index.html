<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/theme.js"></script>
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <meta name="robots" content="{{robots}}">
    <link rel="canonical" href="{{url}}">
    <meta name="theme-color" content="{{themeColor}}">
    <meta name="color-scheme" content="light dark">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{hubName}}">
    <meta property="og:locale" content="en_GB">
    <meta property="og:title" content="{{name}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{url}}">
    <meta property="og:image" content="{{ogImage}}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{name}}: {{description}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{name}}">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="{{ogImage}}">

    <link rel="preload" href="/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/poiret-one-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <!-- Links to the other apps and to the source code. They are plain HTML, outside the React app,
         so they show before the app loads and check-dist can check them. -->
    <nav class="site-links" aria-label="Curiously made">
      <a class="site-links__link" href="{{hub}}" data-hub-link><span class="site-links__icon">{{iconApps}}</span>All apps</a>
      <a class="site-links__link" href="{{repo}}" data-source-link><span class="site-links__icon">{{iconSource}}</span>Source</a>
    </nav>
    <div id="root"></div>
  </body>
</html>
